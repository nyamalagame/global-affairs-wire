name: Refresh feeds and deploy

on:
  schedule:
    # Every 15 minutes, at :04, :19, :34 and :49. Off the quarter hour, when
    # GitHub's scheduler is busiest and delays runs.
    - cron: "4,19,34,49 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feeds and build site
        run: node scripts/fetch-feeds.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Fetch commodity prices
        run: node scripts/fetch-markets.mjs
        continue-on-error: true
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # Dalal Street tab: its own page and feeds, published at /dalal-street/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Dalal Street feeds
        continue-on-error: true   # never block World and India from publishing
        run: |
          pip install feedparser==6.0.11
          mkdir -p _site/dalal-street/data
          cp dalal-street/index.html _site/dalal-street/index.html
          python scripts/fetch_dalal.py _site/dalal-street/data/feeds.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
